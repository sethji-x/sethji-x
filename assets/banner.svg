<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="40%" stop-color="#0a1228"/>
      <stop offset="75%" stop-color="#121a35"/>
      <stop offset="100%" stop-color="#0d0a18"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9d4f0" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#6b7a9e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a1228" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonCore" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="55%" stop-color="#c5d0e8"/>
      <stop offset="100%" stop-color="#7a889e"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c12"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2238" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d1320" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="blurFog" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="420" fill="url(#sky)"/>

  <!-- Distant stars -->
  <g fill="#cdd6f4">
    <circle cx="95" cy="38" r="1.2"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="72" r="1.0"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="28" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="65" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="42" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="55" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="30" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1420" cy="48" r="1.0"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1550" cy="80" r="1.2"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moving clouds -->
  <g opacity="0.55">
    <ellipse cx="200" cy="90" rx="140" ry="28" fill="url(#cloudGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 180,0; 0,0" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="900" cy="60" rx="180" ry="32" fill="url(#cloudGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -220,0; 0,0" dur="55s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1400" cy="100" rx="160" ry="26" fill="url(#cloudGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 140,0; 0,0" dur="42s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Moon -->
  <circle cx="1280" cy="85" r="95" fill="url(#moonGlow)">
    <animate attributeName="r" values="90;102;90" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1280" cy="85" r="38" fill="url(#moonCore)"/>

  <!-- Subtle lightning flash -->
  <g opacity="0">
    <path d="M720,0 L745,55 L725,55 L760,130" stroke="#a8c0e8" stroke-width="2.5" fill="none" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0;0;0.85;0;0;0;0.6;0;0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M1100,0 L1085,40 L1110,40 L1070,95" stroke="#b8d0f0" stroke-width="2" fill="none" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0;0;0;0;0.7;0;0;0;0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Distant hills -->
  <path d="M0,290 Q350,240 700,280 T1600,255 L1600,420 L0,420 Z" fill="#07070e"/>
  <path d="M0,320 Q450,285 850,315 T1600,300 L1600,420 L0,420 Z" fill="url(#ground)"/>

  <!-- Dead trees (minimal, elegant) -->
  <g stroke="#0a0a10" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M95,340 L88,280 M88,280 L70,250 M88,280 L105,245 M95,340 L115,295 M115,295 L130,265"/>
    <path d="M1510,335 L1500,275 M1500,275 L1480,245 M1500,275 L1520,240"/>
  </g>

  <!-- Gravestones representing buried vulnerabilities -->
  <g>
    <!-- Left stone -->
    <path d="M280,355 L280,295 A35,35 0 0 1 350,295 L350,355 Z" fill="#101018" stroke="#3a4558" stroke-width="1.5"/>
    <text x="315" y="320" font-family="Georgia, serif" font-size="11" fill="#6b7a94" text-anchor="middle">WEAK</text>
    <text x="315" y="335" font-family="Georgia, serif" font-size="11" fill="#6b7a94" text-anchor="middle">IAM</text>

    <!-- Center name stone -->
    <path d="M680,360 L680,280 A55,55 0 0 1 790,280 L790,360 Z" fill="#0e0e15" stroke="#4a5a78" stroke-width="2"/>
    <text x="735" y="315" font-family="Georgia, serif" font-size="16" fill="#c5d0e8" text-anchor="middle" font-weight="600">AKSHAT</text>
    <text x="735" y="335" font-family="Georgia, serif" font-size="16" fill="#c5d0e8" text-anchor="middle" font-weight="600">AGGARWAL</text>

    <!-- Right stone -->
    <path d="M1050,355 L1050,300 A32,32 0 0 1 1115,300 L1115,355 Z" fill="#101018" stroke="#3a4558" stroke-width="1.5"/>
    <text x="1082" y="322" font-family="Georgia, serif" font-size="10" fill="#6b7a94" text-anchor="middle">OPEN</text>
    <text x="1082" y="336" font-family="Georgia, serif" font-size="10" fill="#6b7a94" text-anchor="middle">BUCKETS</text>
  </g>

  <!-- Soft candle light near center stone -->
  <circle cx="735" cy="365" r="5" fill="#d4a574">
    <animate attributeName="opacity" values="0.35;0.9;0.45;0.85;0.35" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;5.5;4;5;3.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Fog layers -->
  <g filter="url(#blurFog)" opacity="0.38">
    <ellipse cx="180" cy="380" rx="280" ry="32" fill="#8a93a8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 130,0; 0,0" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="850" cy="390" rx="340" ry="36" fill="#7d8799">
      <animateTransform attributeName="transform" type="translate" values="0,0; -160,0; 0,0" dur="28s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1450" cy="385" rx="260" ry="30" fill="#8a93a8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 110,0; 0,0" dur="25s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Subtle title text at bottom of banner -->
  <text x="800" y="405" font-family="Georgia, serif" font-size="13" fill="#5a6780" text-anchor="middle" letter-spacing="3">BUILDING SECURE CLOUD INFRASTRUCTURE</text>
</svg>